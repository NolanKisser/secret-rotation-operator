---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: secretrotations.rotation.nolankisser.github.io
spec:
  group: rotation.nolankisser.github.io
  names:
    categories:
    - secrets
    kind: SecretRotation
    listKind: SecretRotationList
    plural: secretrotations
    shortNames:
    - sr
    - srot
    singular: secretrotation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.secretName
      name: Secret
      type: string
    - jsonPath: .spec.rotationInterval
      name: Interval
      type: string
    - jsonPath: .status.currentVersion
      name: Version
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.nextRotationTime
      name: Next Rotation
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SecretRotation manages a Kubernetes Secret whose contents are regenerated on a
          schedule, optionally rolling dependent workloads and mirroring to AWS.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SecretRotationSpec defines the desired state of SecretRotation.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy decides whether the Secret is garbage collected together
                  with this resource.
                enum:
                - Delete
                - Retain
                type: string
              keepPrevious:
                description: |-
                  KeepPrevious stores the prior value of every key under "<key>.previous"
                  so consumers can accept both credentials during a rollout.
                type: boolean
              keys:
                description: Keys to generate in the Secret.
                items:
                  description: KeySpec describes one key inside the managed Secret.
                  properties:
                    generator:
                      description: Generator used to produce this key's value.
                      properties:
                        bits:
                          description: Bits is the RSA modulus size.
                          enum:
                          - 2048
                          - 3072
                          - 4096
                          format: int32
                          type: integer
                        encoding:
                          default: base64
                          description: Encoding of the RandomBytes output.
                          enum:
                          - base64
                          - hex
                          type: string
                        length:
                          default: 32
                          description: Length is the number of characters (Password)
                            or bytes (RandomBytes).
                          format: int32
                          maximum: 1024
                          minimum: 8
                          type: integer
                        symbols:
                          description: Symbols adds punctuation characters to the
                            Password alphabet.
                          type: boolean
                        type:
                          description: Type of generator.
                          enum:
                          - Password
                          - RandomBytes
                          - RSAKey
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: bits is required for RSAKey
                        rule: self.type != 'RSAKey' || has(self.bits)
                    name:
                      description: Name of the key in Secret.data.
                      maxLength: 200
                      pattern: ^[-._a-zA-Z0-9]+$
                      type: string
                  required:
                  - generator
                  - name
                  type: object
                maxItems: 32
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              restartTargets:
                description: RestartTargets are rolled after every rotation.
                items:
                  description: |-
                    WorkloadRef points at a workload in the same namespace whose pods consume the
                    Secret. After each rotation the operator bumps an annotation on the pod
                    template, triggering a standard rolling restart.
                  properties:
                    kind:
                      enum:
                      - Deployment
                      - StatefulSet
                      - DaemonSet
                      type: string
                    name:
                      minLength: 1
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                maxItems: 32
                type: array
              rotationInterval:
                description: RotationInterval is how often the Secret is regenerated,
                  e.g. "720h".
                type: string
                x-kubernetes-validations:
                - message: rotationInterval must be at least 1m
                  rule: duration(self) >= duration('1m')
              secretName:
                description: |-
                  SecretName is the name of the Secret (in the same namespace) that this
                  resource manages. Immutable.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: secretName is immutable
                  rule: self == oldSelf
              sinks:
                description: Sinks receive a copy of each new Secret version.
                properties:
                  awsSecretsManager:
                    description: |-
                      AWSSecretsManagerSink mirrors the rotated Secret into AWS Secrets Manager as a
                      JSON document, so workloads outside the cluster see the same credentials.
                    properties:
                      region:
                        description: Region overrides the region from the operator's
                          AWS configuration.
                        type: string
                      secretId:
                        description: |-
                          SecretID is the name or ARN of the Secrets Manager secret. It is created
                          if it does not exist.
                        minLength: 1
                        type: string
                    required:
                    - secretId
                    type: object
                type: object
              suspend:
                description: Suspend pauses scheduled rotation. Manual triggers are
                  also ignored.
                type: boolean
            required:
            - keys
            - rotationInterval
            - secretName
            type: object
          status:
            description: SecretRotationStatus defines the observed state of SecretRotation.
            properties:
              conditions:
                description: 'Conditions: Ready, WorkloadsRestarted, SinksSynced.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: CurrentVersion is a counter incremented on every rotation.
                format: int64
                type: integer
              lastRotationTime:
                description: LastRotationTime is when the Secret was last regenerated.
                format: date-time
                type: string
              nextRotationTime:
                description: NextRotationTime is when the next scheduled rotation
                  is due.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation acted
                  on.
                format: int64
                type: integer
              sinkSyncedVersion:
                description: SinkSyncedVersion is the latest version successfully
                  pushed to every sink.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
