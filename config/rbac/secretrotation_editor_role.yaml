# Aggregates into the built-in edit/admin roles so namespace editors can
# manage SecretRotations without cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secretrotation-editor-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-edit: "true"
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
- apiGroups: ["rotation.nolankisser.github.io"]
  resources: ["secretrotations"]
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups: ["rotation.nolankisser.github.io"]
  resources: ["secretrotations/status"]
  verbs: ["get"]
