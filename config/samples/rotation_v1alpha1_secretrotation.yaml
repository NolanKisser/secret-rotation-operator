# A database credential rotated every 30 days. The previous password is kept
# under "password.previous" so the database can accept both during a rollout.
apiVersion: rotation.nolankisser.github.io/v1alpha1
kind: SecretRotation
metadata:
  name: postgres-app-user
spec:
  secretName: postgres-app-credentials
  rotationInterval: 720h
  keepPrevious: true
  keys:
  - name: password
    generator:
      type: Password
      length: 40
  - name: session-key
    generator:
      type: RandomBytes
      length: 64
      encoding: hex
  restartTargets:
  - kind: Deployment
    name: api
---
# A signing key rotated weekly and mirrored into AWS Secrets Manager.
# Requires the operator to run with --enable-aws-sink and an IAM role
# (see terraform/).
apiVersion: rotation.nolankisser.github.io/v1alpha1
kind: SecretRotation
metadata:
  name: jwt-signing-key
spec:
  secretName: jwt-signing-key
  rotationInterval: 168h
  deletionPolicy: Retain
  keys:
  - name: tls.key
    generator:
      type: RSAKey
      bits: 3072
  sinks:
    awsSecretsManager:
      secretId: prod/jwt-signing-key
