name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMG: ghcr.io/${{ github.repository_owner }}/secret-rotation-operator:${{ github.ref_name }}
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version-file: go.mod
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push multi-arch image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ env.IMG }}
        build-args: VERSION=${{ github.ref_name }}
        provenance: true
        sbom: true
    - uses: sigstore/cosign-installer@v3
    - name: Sign image
      run: cosign sign --yes "${IMG%:*}@${{ steps.build.outputs.digest }}"
    - uses: imranismail/setup-kustomize@v2
    - name: Render install manifest
      run: make build-installer IMG=${IMG}
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/install.yaml
        generate_release_notes: true
